[project]
name = "elmur-klpo"
version = "0.1.0"
description = "Gradient verification and single-reader categorical RTG-KLPO training"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium==0.29.1",
    "numpy>=1.26,<2",
    "popgym==1.0.7",
    "torch>=2.5,<3",
    "tqdm>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"elmur_klpo/vendor/**" = ["ALL"]
